<!DOCTYPE html>
<html>
    <head>

    </head>
    <body style="background-color: black;">
        
        <div id="container" style="width: 180px; height: 300px;  position: relative;  background: yellow; display: flex; justify-self: center; justify-content: center; overflow: hidden; ">
            <!--<div id="animation" style="width: 150px; height: 250px; position: absolute; background: red; position: relative;"> </div>
            -->
            <img src=""  id="image" style ="width: 150px; height: 250px; background-color: gray; position: absolute; position: relative;" >
        </div>

        <h2><a href="teste1">aaaa</a></h2>

        <script>

            image.onclick = function() {
                
              menager();
              ChangeImage(image);
            }

            const masculineCostume = [
                {name: 'fm1', url: 'FM1.png'},
                {name: 'fm2', url: 'FM2.png'},
                {name: 'fm4', url: 'FM4.png'},
                {name: 'fm3', url: 'FM3.png'},
                {name: 'fm5', url: 'FM5.png'}
            ];
    
            // todas as listas de produto
            const myProducts = [masculineCostume];

            let imgCount = 0;

            // configura a posição inicial e velocidade
            let pos = 160;
            let speed = 2;

            // tempo
            let timer = 2000;
            
            // variaveis que cuidam da animation
            let myTimeOut;
            let myAnim;
            let loop = -2;
            let animated = false;
            let finalized = false;

            let destinated = false;


            // referencias para o destino e caminho
            const width = parseFloat(image.style.getPropertyValue('width'));
            const target = width*-1;

            // contador de loop
            let vez = 0;

            window.onload = function (){
                //menager();
            }

            function menager(){
                vez++;

                if (myTimeOut && myAnim) {
                    console.log("Timeout cleared!");
                    clearTimeout(myTimeOut);
                    myTimeOut = null;
                    clearInterval(myAnim);
                    myAnim = null;
                    
                }      
            
                animated = false;
                loop+=2;
                //console.log("vez: " + vez);

                //console.log("loop: " + loop);
                // repete a função com um intervalo de 10ms
                myAnim = setInterval(function()  {
                    if (animated == false) animate(loop, 1.5);
                },
                10);   

                if (vez == 2) timer = 1180;
                else timer = 2000;
            
                myTimeOut = setTimeout(function() {
                        console.log("timeout: " +  timer);
                        if (animated == true) menager();
                }, timer);
                
            }

            function animate(destiny, final){            
                
                if (pos == null) {
                    pos = image.style.right;
                    //console.log("nulo");
                }

                if (pos < target*destiny && destinated == false){
                    //console.log("chegou");
                    //console.log("Pos: " + pos + " destiny; " + target*destiny);
                    animated = true;
                    destinated= true;
                    clearInterval(myAnim);

                } else if (pos < target*final && destinated == true){
                    //console.log("Pos: " + pos + " target; " + target*final);
                    pos = 160;
                    loop = -2;
                    animated = true;
                    destinated = false;
                    finalized = true;
                    vez = 0;
                    //console.log("final e finalized " + finalized );
                    
                    ChangeImage(image);
                    clearInterval(myAnim);
                }
                else {
                    //console.log("animando");
                    pos-= speed;
                    image.style.right = pos + 'px';
                }


            }


            function ChangeImage(imgConteiner){
            
                if (imgConteiner.getAttribute('src') == ""){
                    console.log("entrou");
                    imgConteiner.src = myProducts[0].at(0).url;
                }
                else{
                    console.log("segunda parte");
                    if (imgCount >= 4) imgCount = -1;
                    imgCount++;
                    imgConteiner.src  = myProducts[0].at(imgCount).url;
                    
                    
                }
                
            }
            
        </script>

    </body>
</html>
