<!DOCTYPE html>
<html>
    <head>

    </head>
    <body style="background-color: black;">
        <main id="main" style="background-color: white;">

        </main>
    </body>

    <script>

        window.addEventListener('load', () => {
            teste();
            //let newDiv = document.createElement('div');
            
            //main.append(newDiv);
        });

        function teste(){
            let newDiv = document.createElement('div');
            let newUl = document.createElement('ul');
            let newLi = new Array(6);

            newUl.style = ` display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, 1fr);
                row-gap: 20px;
                column-gap: 20px;
                margin: 100px 100px 100px 250px ;
                
                justify-content: center;`;
            
            
            
            main.append(newDiv);
            main.children[0].append(newUl);
            
            //main.children[1].children[0].append()
            for (let j=0; j<newLi.length;j++){
                newLi[j] = document.createElement('li');
                newLi[j].style = ` margin: auto 50px 150px 50px;
                            padding: auto 10% auto 10%;

                            max-width: 380px;
                            height: 380px;

                            text-align: center;

                            border: 1px solid rgb(239, 128, 1);
                            background-color: rgb(180, 96, 0);
                            border-radius: 40px;`;
                main.children[0].children[0].append(newLi[j]);
            }


        }



    </script>
</html>
