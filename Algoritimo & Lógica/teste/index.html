<!DOCTYPE html>
<html>
    <head>

    </head>
    <body style="background-color: black;">
        
        <div id="container" style="width: 180px; height: 300px;  position: relative;  background: yellow; display: flex; justify-self: center; justify-content: center; ">
            <!--<div id="animation" style="width: 150px; height: 250px; position: absolute; background: red; position: relative;"> </div>
            -->
            <img src="FM1.png"  id="image" style ="width: 150px; height: 250px; background-color: gray; position: absolute; position: relative;" >
        </div>

        <script>

            image.onclick = function() {
                
              menager();

            }

            // configura a posição inicial e velocidade
            let pos = 160;
            let speed = 2;

            // tempo
            let timer = 2000;
            
            // variaveis que cuidam da animation
            let myTimeOut;
            let myAnim;
            let loop = -2;
            let animated = false;
            let finalized = false;

            let destinated = false;


            // referencias para o destino e caminho
            const width = parseFloat(image.style.getPropertyValue('width'));
            const target = width*-1;

            // contador de loop
            let vez = 0;

            window.onload = function (){
                //menager();
            }

            function menager(){
                vez++;
                //if (finalized = true) finalized = false;
                animated = false;
                loop+=2;
                console.log("vez: " + vez);

                console.log("loop: " + loop);
                // repete a função com um intervalo de 10ms
                myAnim = setInterval(function()  {
                    
                    if (animated == false) animate(loop, 1.5);
                },
                10);   

                if (vez == 0) timer = 100;
                else timer = 2000;
                
                if (myTimeOut != null) clearTimeout(myTimeOut);

                myTimeOut = setTimeout(function() {
                        console.log("timeout: " +  timer);
                        if (animated == true) menager();
                }, timer);

                
            }

            function animate(destiny, final){            
                
                if (pos == null) {
                    pos = image.style.right;
                    //console.log("nulo");
                }

                if (pos < target*destiny && destinated == false){
                    console.log("chegou");
                    console.log("Pos: " + pos + " destiny; " + target*destiny);
                    animated = true;
                    destinated= true;
                    clearInterval(myAnim);

                } else if (pos < target*final && destinated == true){
                    console.log("Pos: " + pos + " target; " + target*final);
                    pos = 160;
                    loop = -2;
                    animated = true;
                    destinated = false;
                    finalized = true;
                    vez = 0;
                    console.log("final e finalized " + finalized );
                    clearInterval(myAnim);
                }
                else {
                    console.log("animando");
                    pos-= speed;
                    image.style.right = pos + 'px';
                }
            }
            
        </script>

    </body>
</html>
