<!DOCTYPE html>
<html>
    <head>

    </head>
    <body style="background-color: black;">
        
        <div id="container" style="width: 400px; height: 400px;  position: relative;  background: yellow; display: flex; justify-self: center;">
            <div id="animation" style="width: 50px; height: 50px; position: absolute; background: red; position: relative;"> </div>

        </div>

        <script>

            animation.onclick = function() {
                
              menager();

            }
            let pos;
            let speed = 1;
           
            
            let myAnim;
            let loop = 0;
            let animated = false;

            const width = parseFloat(animation.style.getPropertyValue('width'));
            const target = width*-1;

            window.onload = function (){
                //menager();
            }

            function menager(){
                animated = false;
                loop+=2;

                console.log("loop: " + loop);
                // repete a função com um intervalo de 10ms
                myAnim = setInterval(function()  {
                    if (animated == false) animate(loop, 3);
                },
                10);

                // agenda a chamada de uma função após 4s 
                setTimeout(function() {
                    console.log("timeout");
                    if (animated == true) menager();
                }, 4000);
            }

            function animate(destiny, final){            
                
                if (pos == null) {
                    pos = animation.style.right;
                }

                if (pos <= target*destiny){
                    console.log("chegou");
                    animated = true;
                    clearInterval(myAnim);
                } else if (pos <= target*final){
                    console.log("final");
                    pos = 0;
                    loop = 0;
                    animated = true;
                    clearInterval(myAnim);
                }
                else {
                    console.log("animando");
                    pos-= speed;
                    animation.style.right = pos + 'px';
                }
            }
            
        </script>

    </body>
</html>
